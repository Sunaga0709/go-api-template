# golangci-lint configuration (v2 schema)
# Docs: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  # Build tags / test files are linted by default.
  timeout: 5m

linters:
  # Start from the curated default set (errcheck, govet, ineffassign,
  # staticcheck, unused) and layer additional production-grade linters on top.
  default: standard
  enable:
    - bodyclose # checks that HTTP response bodies are closed
    - contextcheck # ensures context is passed through (not context.Background mid-call)
    - durationcheck # catches multiplications of two time.Duration values
    - errname # error vars are Err*, error types are *Error
    - errorlint # correct error wrapping/comparison for Go 1.13+ errors
    - gocritic # opinionated diagnostics, performance and style checks
    - gosec # security-focused analysis
    - misspell # spelling mistakes in comments/strings
    - nakedret # discourages naked returns in longer functions
    - nilerr # returning nil after a non-nil error check
    - noctx # HTTP requests / SQL queries without a context
    - nolintlint # keeps //nolint directives honest and specific
    - predeclared # shadowing of predeclared identifiers
    - reassign # reassigning values to package-level variables
    - revive # broad, configurable replacement for golint
    - rowserrcheck # checks sql.Rows.Err is consulted
    - sloglint # consistent log/slog usage
    - sqlclosecheck # sql.Rows / sql.Stmt are closed
    - unconvert # unnecessary type conversions
    - unparam # unused function parameters / results
    - wastedassign # assignments never used before being overwritten
    - whitespace # leading/trailing whitespace issues

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - fieldalignment # struct field ordering is not worth enforcing here
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: early-return
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
    gosec:
      excludes:
        - G104 # handled by errcheck with more context
    nakedret:
      max-func-lines: 30
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    # Use the curated default exclusion presets as a baseline.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files may legitimately ignore errors and take security shortcuts.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - noctx
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # Group module-internal imports into their own block.
      local-prefixes:
        - github.com/Sunaga0709/go-api-template
  exclusions:
    generated: lax
